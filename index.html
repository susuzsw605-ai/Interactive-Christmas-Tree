<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ASCII Christmas Tree — Hand Grown</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#666e7d; }
  body { display:grid; place-items:center; font-family:Menlo,Consolas,monospace; }
  #stage { position:relative; width:min(100vw,56.25vh); height:100vh; }
  canvas { display:block; width:100%; height:100%; }
  #cam {
    position:absolute; right:3.2%; top:2.5%; width:26%; aspect-ratio:1;
    object-fit:cover; transform:scaleX(-1); border:1px solid rgba(255,255,255,.72);
    border-radius:12px; opacity:.82; display:none; background:rgba(30,35,44,.3);
  }
  #status {
    position:absolute; left:3%; bottom:1.5%; color:rgba(245,245,238,.7);
    font:10px/1.4 Menlo,Consolas,monospace; pointer-events:none; letter-spacing:.04em;
  }
  #start {
    position:absolute; inset:0; display:grid; place-items:center; cursor:pointer;
    color:#f2ead4; font: bold 18px Menlo,Consolas,monospace; letter-spacing:.2em;
    background:transparent; border:0; text-shadow:0 0 12px rgba(255,240,190,.25);
  }
  #start[hidden] { display:none; }
  @media (prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <video id="cam" playsinline muted></video>
  <button id="start" aria-label="Play">P L A Y</button>
  <div id="status">1–6: stages · SPACE: pause · R: replay · T: twist</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
(() => {
'use strict';
const canvas=document.getElementById('view'), ctx=canvas.getContext('2d');
const cam=document.getElementById('cam'), startBtn=document.getElementById('start'), statusEl=document.getElementById('status');
const stageEl=document.getElementById('stage');
const AR=1/1.62, COLS=124;
let PW=0,H=0,CW=0,CH=0,ROWS=0,cols=0,dpr=1,off,ox;
let chars,colors,depths,filmT=0,stage=0,playing=false,paused=false,auto=false,lastFrame=0,lastT=0;
let audio=null,master=null,voiceBus=null, snow=[], dust=[], points=[], lights=[], baubles=[], gifts=[], sparks=[];
let hands=null,stream=null,lastDetect=0,detectBusy=false,landmarks=[],gestureHistory=[],fistAt=0,openAt=0,lastCircle=0,circleTrack=[],bothOpenAt=0,heartFrames=0;
let twistUntil=0,twistDir=1,prevPalmAngle=null,prevPalmTime=0, gestureLock=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t<.5?Math.pow(2*t,1.5)/2:1-Math.pow(2*(1-t),1.5)/2;};
function seeded(seed){return ()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
const rand=seeded(20261124);
function layout(){
  const vw=innerWidth, vh=innerHeight;
  PW=Math.min(vw,vh*9/16); H=vh; CW=PW/COLS; CH=CW*1.62; ROWS=Math.floor(H/CH);
  cols=Math.ceil(vw/CW); dpr=Math.min(devicePixelRatio||1,2);
  stageEl.style.width=PW+'px'; stageEl.style.height=H+'px';
  canvas.width=Math.round(vw*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=vw+'px'; canvas.style.height=H+'px';
  canvas.style.position='absolute'; canvas.style.left=((vw-PW)/2*-1)+'px';
  off=document.createElement('canvas'); off.width=canvas.width; off.height=canvas.height;
  ox=off.getContext('2d'); ox.setTransform(dpr,0,0,dpr,0,0); ctx.setTransform(dpr,0,0,dpr,0,0);
  chars=new Array(cols*ROWS); colors=new Array(cols*ROWS); depths=new Float32Array(cols*ROWS);
}
addEventListener('resize',layout); layout();
function idx(x,y){return y*cols+x;}
function put(x,y,ch,color,z=0){
  x=Math.round(x); y=Math.round(y);
  if(x<0||x>=cols||y<0||y>=ROWS||!ch)return;
  const i=idx(x,y); if(z>=depths[i]){chars[i]=ch;colors[i]=color;depths[i]=z;}
}
function resetGrid(){chars.fill('');colors.fill('');depths.fill(-1e9);}
function screenX(x){return x+(cols-COLS)/2;}
function cell(x,y,ch,color,z){put(screenX(x),y,ch,color,z);}
function initParticles(){
  snow=[];for(let i=0;i<230;i++)snow.push({x:rand()*cols,y:rand()*ROWS,s:1.5+rand()*3.5,p:rand()*6.28,a:.22+rand()*.78});
  dust=[];for(let i=0;i<170;i++)dust.push({a:rand()*Math.PI*2,r:rand()*.55+.45,y:rand(),s:.15+rand()*.45});
  points=[]; lights=[]; baubles=[];
  const tiers=[{f:.02,h:.25,r:1.08,n:13},{f:.23,h:.20,r:.80,n:11},{f:.41,h:.17,r:.62,n:9},{f:.57,h:.15,r:.46,n:8},{f:.71,h:.13,r:.32,n:7},{f:.83,h:.12,r:.19,n:6}];
  for(let ti=0;ti<tiers.length;ti++){
    const q=tiers[ti], lobes=[];
    for(let l=0;l<q.n;l++)lobes.push(.72+rand()*.52);
    const count=ti===0?12000:ti===1?8500:ti===2?6500:ti===3?5000:ti===4?3800:2600;
    for(let j=0;j<count;j++){
      const f=q.f+rand()*q.h, local=(f-q.f)/q.h;
      const a=rand()*Math.PI*2, ring=rand();
      const lobe=((a/(Math.PI*2)*q.n)%1), li=Math.floor(a/(Math.PI*2)*q.n);
      const scallop=lobes[li]*(.88+.12*Math.cos(lobe*Math.PI*2));
      let radial=q.r*(1-local*.78)*scallop;
      const core=rand()<.30;
      if(core)radial*=Math.sqrt(rand())*.48;
      else radial*=.64+Math.pow(rand(),.55)*.36;
      points.push({f,a,r:radial,ti,core,seed:rand(),droop:Math.pow(Math.max(0,local),2)*(.012+rand()*.022),glyph:rand()});
    }
    for(let j=0;j<Math.max(3,Math.round(q.n*.28));j++){
      baubles.push({f:q.f+.025+rand()*q.h*.7,a:rand()*Math.PI*2,r:q.r*(.88+rand()*.12),drop:rand()*.16});
    }
    for(let j=0;j<Math.round(q.n*8);j++){
      lights.push({f:q.f+.012+q.h*.78,a:rand()*Math.PI*2,r:q.r*(.94+rand()*.035),seed:rand(),gold:rand()<.13});
    }
  }
  gifts=[
    {x:-.72,z:.55,w:1.0,h:.82,c:354,r:46},
    {x:-.34,z:.9,w:.62,h:.58,c:45,r:354},
    {x:.35,z:.92,w:1.08,h:.52,c:145,r:46},
    {x:.72,z:.52,w:.58,h:1.0,c:210,r:46},
    {x:0,z:1.12,w:.76,h:.72,c:315,r:46}
  ];
}
initParticles();
function stageTimes(){return [0,1.5,5.6,6.25,9.25,10.8,12.25];}
function treeGeom(){return {cx:cols/2,base:ROWS*.698,height:ROWS*.425,rot:performance.now()/1000*.5};}
function treeRadius(f){const tier=f<.23?0:f<.41?1:f<.57?2:f<.71?3:f<.83?4:5;const q=[1.08,.80,.62,.46,.32,.19][tier];const starts=[0,.23,.41,.57,.71,.83],heights=[.25,.20,.17,.15,.13,.12];return q*(1-clamp((f-starts[tier])/heights[tier],0,1)*.78);}
function project(g,f,r,a,droop=0){const phi=a+g.rot+(Date.now()<twistUntil?twistDir*.65:0);return {x:g.cx+r*Math.sin(phi),y:g.base-f*g.height+droop*g.height+r*Math.cos(phi)*.17*AR,z:r*Math.cos(phi)};}
function hsl(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`;}
function drawBackground(){
  const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#323a47');grad.addColorStop(.55,'#394250');grad.addColorStop(.86,'#4b5463');grad.addColorStop(1,'#666e7d');ctx.fillStyle=grad;ctx.fillRect(0,0,innerWidth,H);
}
function drawSnow(dt,now){
  for(const p of snow){p.y+=p.s*dt*ROWS/100;p.x+=Math.sin(now*.0007+p.p)*dt*.7;if(p.y>ROWS+1){p.y=-1;p.x=rand()*cols;}if(p.x<0)p.x=cols;if(p.x>=cols)p.x=0;
    put(p.x,p.y,'+',`rgba(248,250,255,${p.a})`,-100);
  }
}
function halo(x,y,r,now){
  const n= Math.ceil(r*7), tick=Math.floor(now/110);
  for(let i=0;i<n;i++){const a=i*2.399+tick*.03,rr=r*Math.sqrt((i+.5)/n),xx=Math.round(x+Math.cos(a)*rr),yy=Math.round(y+Math.sin(a)*rr*AR);
    const p=1-rr/r;if(rand()<p*.45){const k=idx(xx,yy);if(xx>=0&&xx<cols&&yy>=0&&yy<ROWS&&(!chars[k]))put(xx,yy,p>.7?'+':p>.35?':':'.',`rgba(255,226,169,${p*.55})`,-50);}
  }
}
function drawDisc(T,now,g){
  const impact=clamp((T-.39)/1,0,1);if(impact<=0)return;
  const cy=ROWS*.845, rx=COLS*.8*impact, ry=rx*AR*.28;
  for(let x=-rx;x<=rx;x+=.7){const u=x/Math.max(1,rx),edge=Math.sqrt(Math.max(0,1-u*u));const y=cy+edge*ry;
    if(rand()<.72)cell(g.cx+x,y,'-',hsl(46,22,31+Math.sin(x*.4+now*.001)*4,.85),-5);
    if(Math.abs(u)>.96||Math.abs(u)<.04)cell(g.cx+x,y,'=',hsl(46,28,61,.9),-4);
  }
  if(impact>.7){
    for(let ring=0;ring<2;ring++)for(let a=0;a<Math.PI*2;a+=.035){const rr=(.22+ring*.24+((now*.0001)%1)*.02)*rx;const x=g.cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*AR*.28;if(Math.abs(Math.sin(a))<.45)cell(x,y,ring?'#':'+',hsl(46,30,57,.72),-3);}
  }
  for(let k=0;k<16;k++){const a=k*Math.PI/8+g.rot*.3;const rr=rx*(.25+.12*Math.sin(k*2));const x=g.cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*AR*.28;cell(x,y,'+',hsl(45,30,62,.65),-2);}
}
function drawTrunk(T,g){
  const rise=clamp((T-1.05)/.45,0,1), rows=Math.floor(g.height*.16*rise);
  for(let yy=0;yy<rows;yy++){const f=yy/Math.max(1,rows),w=3.5+Math.max(0,1-f)*2.5;
    for(let x=-w;x<=w;x+=.7){const shade=clamp(13-Math.abs(x/w)*12,2,15);cell(g.cx+x,g.base-yy,['#','8','%','@'][Math.floor((x+yy)%4+4)%4],hsl(20,46,shade),3);}
  }
}
function drawTree(T,g,now){
  if(T<2.1)return;
  const growth=ease(clamp((T-2.1)/4.35,0,1))*1.12;
  for(let i=0;i<points.length;i++){
    const p=points[i];if(growth<p.f)continue;
    const fresh=clamp((growth-p.f)*8,0,1),frost=clamp((T-6.1)*.25,0,1);
    const pr=project(g,p.f,p.r,p.a,p.droop),x=pr.x,y=pr.y;
    const side=Math.cos(p.a+g.rot),direction=clamp((-.35-side)*1.8,0,1);
    const streak=.78+.22*Math.sin(p.a*19+p.ti*3);
    let light=5+Math.pow(Math.max(0,side),1.5)*52+streak*7;
    light*=p.core?.62:1;light*=p.f>.83?.78:1;
    light*=1-clamp((p.f-(growth-.025))/.025,0,1)*.45;
    if(frost>.1&&!p.core&&side<-.45&&p.seed>.78)light=lerp(light,93,frost*.85);
    const hue=150+(p.seed-.5)*10,sat=lerp(72,50,p.seed);
    let col=hsl(hue,sat,clamp(light,4,70));
    const deerZone=T>10.85&&Math.abs(y-(g.base-g.height*.2))<5&&Math.abs(x-g.cx)<17;
    if(deerZone)col=hsl(hue,sat,clamp(light*.25,2,20));
    const glyph=light<17?'8':light<30?'&':light<45?'%':light<60?'#':'@';
    cell(x,y,fresh<.15?'#':glyph,col,pr.z+10);
    if(!p.core&&p.seed>.9992&&Math.sin(now*.012+p.seed*99)>.8)cell(x,y,'*','#f4f5eb',pr.z+12);
  }
  // ornaments
  for(const b of baubles){if(growth<b.f+.015)continue;const pop=clamp((growth-b.f)*8,0,1);const pr=project(g,b.f,b.r,b.a,.012);const x=pr.x,y=pr.y+pop*.8;
    const red=hsl(354,80,42+pop*12);cell(x-1,y,'@',red,30);cell(x,y,'@',red,30);cell(x+1,y,'@',red,30);cell(x-1,y+1,'@',red,30);cell(x,y+1,'O',red,30);cell(x+1,y+1,'@',red,30);cell(x-1,y,'*','#fff2e6',31);
  }
}
function drawGrowthRing(T,g){
  if(T<1.5||T>6.35)return;
  if(T<2.1)return;
  const growth=ease(clamp((T-2.1)/3.5,0,1)),f=clamp(growth,0,1),r=treeRadius(f)*1.14+.035;
  for(let a=0;a<Math.PI*2;a+=.045){const p=project(g,f,r,a);const hue=(a*180/Math.PI*2+performance.now()*.05)%360;for(let k=0;k<3;k++)cell(p.x,p.y-k,'#',hsl(hue,70,65,.58-k*.13),p.z+25);}
}
function drawStar(T,g,now){
  if(T<5.6)return;const p=project(g,1,0,0);const open=clamp((T-5.6)/.65,0,1),pulse=1+.08*Math.sin(now*.002);
  const x=p.x,y=g.base-g.height-2;
  const gold=hsl(44,66,72+Math.sin(now*.003)*5);
  if(open<.15){cell(x,y,'@',gold,80);return;}
  const core=['  ###  ','##@@@##','  ###  '];
  for(let j=0;j<3;j++)for(let i=0;i<7;i++)if(core[j][i]!==' ')cell(x+(i-3)*pulse,y+j-1,core[j][i],gold,80);
  const rays=[[0,-13,'|'],[0,13,'|'],[-13,0,'-'],[13,0,'-'],[-7,-7,'\\'],[7,-7,'/'],[-7,7,'/'],[7,7,'\\']];
  for(const [dx,dy,ch] of rays){const len=Math.hypot(dx,dy),steps=Math.ceil(len*open);for(let i=3;i<steps;i++)cell(x+dx/len*i,y+dy/len*i,ch,gold,79);}
  for(let i=0;i<16;i++){const a=i*Math.PI/8+now*.00025;cell(x+Math.cos(a)*11,y+Math.sin(a)*11*AR,i%3?'+' : '*',hsl([318,282,228,190,150,56,38][i%7],75,70),78);}
}
function hueRamp(v){const ramp=[318,282,228,190,150,56,38,56,150,190,228,282,318],u=clamp(v,0,.999)*12,i=Math.floor(u);return lerp(ramp[i],ramp[i+1],u-i);}
function drawLights(T,g,now){
  if(T<6.25)return;
  const progress=clamp((T-6.25)/3,0,1);
  // comet trails
  for(let c=0;c<2;c++){
    const headF=1-progress*.98,headA=(c?Math.PI:0)+progress*Math.PI*8;
    for(let j=110;j>=0;j--){const q=j/110, f=clamp(headF+q*.22,0,1),a=headA-q*.7;
      const rr=treeRadius(f)*1.1;const p=project(g,f,rr,a);
      const ch=j<8?'#':j<28?'*':j<65?'+':'.';
      cell(p.x,p.y,ch,hsl(hueRamp((a/(Math.PI*2)+now*.00003+c*.5)%1),100,65,1-q*.006),45);
    }
    if(progress<1){const p=project(g,headF,treeRadius(headF)*1.1,headA);cell(p.x,p.y,'@','#fff9ed',50);cell(p.x-1,p.y,'@',hsl(c?318:56,100,68),49);}
  }
  for(const l of lights){
    const needed=clamp((1-l.f)*4,0,1);
    if(progress<needed)continue;
    const p=project(g,l.f,l.r,l.a);
    const hue=l.gold?44:hueRamp((l.a/(Math.PI*2)+.5)%1);
    const tw=.75+.25*Math.sin(now*.006+l.seed*20);
    const deerZone=T>10.85&&Math.abs(p.y-(g.base-g.height*.2))<5&&Math.abs(p.x-g.cx)<17;
    if(!deerZone)cell(p.x,p.y,['@','o','*','0'][Math.floor(l.seed*4)],hsl(hue,l.gold?70:100,60*tw),55);
  }
}
function drawGifts(T,g){
  if(T<9.3)return;
  gifts.forEach((b,i)=>{const p=clamp((T-(9.35+i*.26))/.42,0,1);if(!p)return;const s=(1.15*p-.15*Math.sin(p*Math.PI))*p;
    const x=g.cx+b.x*COLS*.30,y=ROWS*.845-2+(i%2)*.7;
    const w=b.w*s,h=b.h*s,body=hsl(b.c,70,clamp(30+20*p,0,55)),rib=hsl(b.r,70,68);
    for(let yy=0;yy<h*3;yy++)for(let xx=-w*2;xx<=w*2;xx++){if(rand()<.8)cell(x+xx,y-yy,['#','@','%','&','8'][Math.floor(rand()*5)],body,65);}
    for(let xx=-w*2;xx<=w*2;xx++)cell(x+xx,y-h*3,'=',rib,70);
    for(let yy=0;yy<h*3;yy++)cell(x,y-yy,'|',rib,71);
    cell(x-1,y-h*3-1,'*',rib,72);cell(x+1,y-h*3-1,'*',rib,72);
  });
}
function drawDeer(T,g,now){
  if(T<10.85)return;
  const p=clamp((T-10.85)/1.4,0,1),scale=(p<.8?ease(p/.8)*1.12:1.12)*.75;
  const bob=Math.sin(now*.012)*.7, x=g.cx+1,y=g.base-g.height*.2+bob;
  const shape=[
    [ -8,0, 'body'],[-5,-1,'body'],[-2,0,'body'],[2,0,'body'],[5,-1,'body'],[7,-3,'neck'],[9,-5,'head'],[12,-5,'head'],[14,-4,'head'],
    [8,-8,'antler'],[7,-11,'antler'],[5,-13,'antler'],[9,-11,'antler'],[11,-9,'antler'],[12,-12,'antler'],[14,-10,'antler'],
    [-9,-2,'tail'],[-10,-4,'tail']
  ];
  shape.forEach(([dx,dy,type])=>{const xx=x+dx*scale,yy=y+dy*scale;cell(xx,yy,type==='antler'?'Y':type==='head'?'@':'#','#f8f6ee',90);});
  // leaping legs, alternating phases
  for(let leg=0;leg<4;leg++){const phase=now*.006+(leg%2)*Math.PI, swing=Math.sin(phase),hip=x+(leg<2?-5:4)*scale,hy=y+(leg<2?0:1)*scale;
    const kneeX=hip+(leg<2?-2:2)*scale+swing*2*scale,kneeY=hy+(swing>0?-3:2)*scale;
    const footX=kneeX+(leg<2?-2:3)*scale+swing*3*scale,footY=kneeY+4*scale;
    for(let k=0;k<3;k++){cell(lerp(hip,kneeX,k/3),lerp(hy,kneeY,k/3),'#','#f8f6ee',91);cell(lerp(kneeX,footX,k/3),lerp(kneeY,footY,k/3),'#','#f8f6ee',91);}
  }
  for(let i=0;i<32;i++){const xx=x+(rand()-.5)*22*scale,yy=y+(rand()-.5)*10*scale;if(rand()<.5)cell(xx,yy,['+','*','x',':'][i%4],'rgba(220,237,247,.6)',89);}
}
function drawDust(T,g,now,dt){
  if(T<3.4)return;
  for(const p of dust){const a=p.a+now*.00015*p.s,r=p.r*(.35+.65*Math.sin(now*.0003+p.y*9));const x=g.cx+Math.cos(a)*r*COLS*.36,y=g.base-g.height*(.15+p.y*.85)-((now*.002*p.s)%5);
    cell(x,y,p.s>.4?'*':'+',`rgba(226,221,207,${.22+p.s*.25})`,2);
  }
}
function drawImpactSparks(T,g,now){
  if(T<.39||T>1.4)return;
  const p=(T-.39)/1.01;
  for(let i=0;i<80;i++){const a=i*2.399,r=(p*18+(i%9)*.6),x=g.cx+Math.cos(a)*r,y=ROWS*.845-Math.sin(a)*r*.45+p*p*8;
    if(y<ROWS*.845)cell(x,y,p<.35?'*':p<.7?'+':'.',hsl(42,65,72,1-p),20);
  }
}
function drawFilm(now,dt){
  resetGrid();const g=treeGeom();drawSnow(dt,now);drawDisc(filmT,now,g);drawImpactSparks(filmT,g,now);
  if(filmT>=.05&&filmT<.39){const p=(filmT-.05)/.34,y=-5+p*(ROWS*.85+5);for(let k=0;k<22;k++)put(cols/2,y-k,k<3?'@':k<10?'#':'|',`rgba(255,238,205,${1-k/25})`,60);}
  drawTrunk(filmT,g);drawTree(filmT,g,now);drawGrowthRing(filmT,g);drawStar(filmT,g,now);drawLights(filmT,g,now);drawGifts(filmT,g);drawDeer(filmT,g,now);drawDust(filmT,g,now,dt);
  // Character-only bloom.
  renderGrid();
  ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.4;ctx.filter=`blur(${PW*.006}px)`;ctx.drawImage(off,(innerWidth-PW)/2,0,PW,H);ctx.globalAlpha=.12;ctx.filter=`blur(${PW*.02}px)`;ctx.drawImage(off,(innerWidth-PW)/2,0,PW,H);ctx.restore();
}
function renderGrid(){
  ox.clearRect(0,0,innerWidth,H);ox.font=`bold ${CH*.95}px Menlo,Consolas,"DejaVu Sans Mono",monospace`;ox.textAlign='center';ox.textBaseline='middle';
  for(let y=0;y<ROWS;y++)for(let x=0;x<cols;x++){const i=idx(x,y);if(chars[i]){ox.fillStyle=colors[i]||'#fff';ox.fillText(chars[i],(x+.5)*CW,(y+.5)*CH);}}
  ctx.drawImage(off,0,0,innerWidth,H);
}
const FONT={
 P:['11110','10001','10001','11110','10000','10000','10000'],
 L:['10000','10000','10000','10000','10000','10000','11111'],
 A:['01110','10001','10001','11111','10001','10001','10001'],
 Y:['10001','10001','01010','00100','00100','00100','00100']
};
function drawStart(now,dt){
  resetGrid();drawSnow(dt,now);
  const word='PLAY',scale=2.4,total=word.length*6*scale;let x=Math.round(cols/2-total/2),y=Math.round(ROWS*.48-8);
  for(const c of word){const glyph=FONT[c];for(let j=0;j<7;j++)for(let i=0;i<5;i++)if(glyph[j][i]==='1')put(x+i*scale,y+j*scale,'#',`hsl(44,45%,${68+12*Math.sin(now*.002+i+j)}%)`,10);x+=6*scale;}
  renderGrid();
}
function makeAudio(){
  if(audio){audio.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  audio=new AC();voiceBus=audio.createGain();voiceBus.gain.value=.85;
  const dry=audio.createGain();dry.gain.value=.85;
  const wet=audio.createGain();wet.gain.value=.32;
  const conv=audio.createConvolver(),len=Math.floor(audio.sampleRate*2.4),buf=audio.createBuffer(2,len,audio.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  conv.buffer=buf;voiceBus.connect(dry);voiceBus.connect(conv);conv.connect(wet);
  const comp=audio.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
  dry.connect(comp);wet.connect(comp);master=audio.createGain();master.gain.value=1.3;comp.connect(master);master.connect(audio.destination);
}
function tone(freq,dur=.35,type='sine',gain=.08,pan=0,endFreq=null){
  if(!audio||audio.state!=='running')return;
  const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),p=audio.createStereoPanner();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,freq),t);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  p.pan.value=pan;o.connect(g);g.connect(p);p.connect(voiceBus);o.start(t);o.stop(t+dur+.02);
}
function bell(deg,dur=.8,gain=.07,pan=0){
  const scale=[0,2,4,7,9],oct=Math.floor(deg/5),semi=scale[(deg%5+5)%5]+oct*12;
  const f=523.25*Math.pow(2,semi/12);tone(f,dur,'sine',gain,pan);tone(f*2.76,dur*.55,'sine',gain*.2,pan);tone(f*5.4,dur*.35,'sine',gain*.07,pan);
}
function noise(dur=.4,gain=.025,freq=3000){
  if(!audio||audio.state!=='running')return;const t=audio.currentTime,n=audio.createBufferSource(),b=audio.createBuffer(1,audio.sampleRate*.5,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  n.buffer=b;n.loop=true;const filter=audio.createBiquadFilter();filter.type='bandpass';filter.frequency.value=freq;const g=audio.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(filter);filter.connect(g);g.connect(voiceBus);n.start(t);n.stop(t+dur+.03);
}
let cueFlags={};
function cue(key,fn){if(!cueFlags[key]){cueFlags[key]=true;fn();}}
function sounds(T,prev){
  if(T>prev){
    if(prev<.05&&T>=.05)cue('drop',()=>{tone(2400,.34,'sine',.05,0,620);bell(16,.7,.035);});
    if(prev<.39&&T>=.39)cue('land',()=>{tone(120,.7,'sine',.11,0,44);noise(1.2,.04,900);bell(-10,1.8,.06,-.3);bell(-5,1.8,.05,.3);});
    if(prev<1.05&&T>=1.05)cue('trunk',()=>{for(let i=0;i<6;i++)setTimeout(()=>tone(110+i*22,.09,'triangle',.035),i*70);});
    if(prev<1.5&&T>=1.5)cue('ring',()=>{tone(330,.6,'sine',.04,0,990);noise(.6,.035,1600);bell(8,.9,.06);});
    if(prev<2.1&&T>=2.1)cue('grow',()=>{for(let i=0;i<20;i++)setTimeout(()=>bell(8+Math.floor(Math.random()*12),.4,.018,Math.random()-.5),i*160);noise(3.4,.012,3200);});
    if(prev<5.6&&T>=5.6)cue('star',()=>{for(let i=0;i<5;i++)setTimeout(()=>bell(12+i,.35,.05),i*75);setTimeout(()=>[0,2,4,7].forEach((d,i)=>bell(d+10,.9,.045,i%2?-.5:.5)),380);noise(.6,.02,6200);});
    if(prev<6.25&&T>=6.25)cue('comets',()=>{noise(1.2,.03,1800);for(let i=0;i<24;i++)setTimeout(()=>bell(16-Math.floor(i*.7),.5,.027,i%2?-.8:.8),i*125);});
    if(prev<9.25&&T>=9.25)cue('lit',()=>{[0,2,4,7].forEach((d,i)=>setTimeout(()=>bell(d-5,2,.04,i%2?-.5:.5),i*45));});
    for(let i=0;i<5;i++)if(prev<9.35+i*.26&&T>=9.35+i*.26)cue('gift'+i,()=>{tone(180,.16,'sine',.055,0,580);noise(.08,.018,4200);bell(5+i,.55,.045);});
    if(prev<10.85&&T>=10.85)cue('deer',()=>{for(let i=0;i<7;i++)setTimeout(()=>bell(i+5,.4,.05,(i/3.5)-1),i*95);for(let i=0;i<8;i++)setTimeout(()=>{noise(.12,.02,6000);bell(22,.22,.025,Math.random()-.5);},800+i*170);});
  }
}
function openStage(n){
  if(n!==stage+1||n>6)return;
  const times=stageTimes();filmT=times[n-1];stage=n;gestureLock=performance.now()+700;
  gestureHistory=[];circleTrack=[];fistAt=0;openAt=0;bothOpenAt=0;heartFrames=0;cueFlags={};
  if(n===6)filmT=10.8;
}
function triggerStage(n){if(!playing)return;openStage(n);}
function startFilm(){
  if(playing)return;playing=true;paused=false;filmT=0;stage=0;lastT=0;cueFlags={};makeAudio();startBtn.hidden=true;
  startCamera();
}
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia||!window.Hands){auto=true;statusEl.textContent='Camera unavailable · automatic film';return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    cam.srcObject=stream;await cam.play();cam.style.display='block';
    hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
    hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(onHands);
    statusEl.textContent='Make gestures to grow · 1–6 keys also work';
  }catch(e){auto=true;cam.style.display='none';statusEl.textContent='Camera unavailable · automatic film';}
}
function dist(a,b,aspect=16/9){return Math.hypot((a.x-b.x)*aspect,a.y-b.y);}
function fingerExtended(l,tip,mid){return dist(l[tip],l[0])>dist(l[mid],l[0])*1.12;}
function classify(l){
  const ext=[ [8,6],[12,10],[16,14],[20,18] ].map(v=>fingerExtended(l,v[0],v[1]));
  const upright=[5,9,13,17].every(i=>l[i].y<l[0].y-.3*dist(l[0],l[9]));
  const open=ext.filter(Boolean).length>=4,fist=ext.every(v=>!v);
  const pointing=ext[0]&&!ext[1]&&!ext[2]&&!ext[3]&&l[8].y<l[5].y-.12;
  const size=dist(l[0],l[9]);
  return {open,fist,upright,pointing,size,ext};
}
function visibleHand(l){return l[9].x>.37&&l[9].x<.63&&l[9].y>.02&&l[9].y<.98;}
function onHands(res){
  landmarks=(res.multiHandLandmarks||[]).filter(visibleHand);
  drawCameraOverlay(res);
  if(performance.now()<gestureLock)return;
  const now=performance.now(), hs=landmarks.map(l=>({l,c:classify(l)}));
  const upright=hs.filter(h=>h.c.upright);
  const open= upright.filter(h=>h.c.open),fists=upright.filter(h=>h.c.fist);
  // Fist -> open sequence
  if(fists.length){fistAt=now;openAt=0;}
  if(open.length&&fistAt&&now-fistAt<1000){openAt=now;fistAt=0;if(stage===0)triggerStage(1);}
  // Circle: track index fingertip, aspect-corrected path
  const pointer= upright.find(h=>h.c.pointing);
  if(pointer){
    const p=pointer.l[8];circleTrack.push({x:p.x*16/9,y:p.y,t:now,otherOpen:open.some(h=>h!==pointer)});
    circleTrack=circleTrack.filter(v=>now-v.t<1800);
    if(circleTrack.length>8){
      const cx=circleTrack.reduce((s,v)=>s+v.x,0)/circleTrack.length,cy=circleTrack.reduce((s,v)=>s+v.y,0)/circleTrack.length;
      const angles=circleTrack.map(v=>Math.atan2(v.y-cy,v.x-cx));let sweep=0;for(let i=1;i<angles.length;i++){let d=angles[i]-angles[i-1];while(d>Math.PI)d-=2*Math.PI;while(d< -Math.PI)d+=2*Math.PI;sweep+=d;}
      const rad=Math.max(...circleTrack.map(v=>Math.hypot(v.x-cx,v.y-cy)));
      const paired=stage!==1||circleTrack.filter(v=>v.otherOpen).length/circleTrack.length>.8;
      if(Math.abs(sweep)>Math.PI*1.5&&rad>pointer.c.size*.33&&paired&&now-lastCircle>2200){if(stage===1)triggerStage(2);else if(stage===3)triggerStage(4);lastCircle=now;circleTrack=[];}
    }
  }else circleTrack=[];
  // Snap proxy: thumb touching straight middle, then collapse
  const snapHand=upright.find(h=>{const l=h.l;return dist(l[12],l[0])>h.c.size*1.3&&dist(l[4],l[12])<h.c.size*.22;});
  if(snapHand){gestureHistory.push({t:now,m:dist(snapHand.l[12],snapHand.l[0]),l:snapHand.l});}
  else if(stage===2&&gestureHistory.length){
    const prev=gestureHistory[gestureHistory.length-1];if(now-prev.t<180&&prev.m-dist((upright[0]||{l:prev.l}).l[12],(upright[0]||{l:prev.l}).l[0])>.45*(upright[0]?.c.size||.2))triggerStage(3);
    gestureHistory=[];
  }
  if(stage===4&&open.length>=2&&dist(open[0].l[0],open[1].l[0])>1.5*Math.max(open[0].c.size,open[1].c.size)){
    if(!bothOpenAt)bothOpenAt=now;if(now-bothOpenAt>300)triggerStage(5);
  }else bothOpenAt=0;
  // Heart: fingertips meet, wrists apart, fingers bent
  if(stage===5&&hs.length>=2){
    const a=hs[0].l,b=hs[1].l;
    const touch=dist(a[4],b[4])<.22&&Math.min(dist(a[8],b[8]),dist(a[12],b[12]))<.28;
    const bent=hs.every(h=>h.c.ext.filter(Boolean).length<=1);
    if(touch&&bent&&dist(a[0],b[0])>.35)heartFrames++;else heartFrames=0;
    if(heartFrames>=4)triggerStage(6);
  }
  // Snow gesture is always available; extra snow is added by hand motion.
  for(const h of hs){const l=h.l,down=[8,12,16,20].every(i=>l[i].y>l[0].y&&l[i].y>l[[5,9,13,17][[8,12,16,20].indexOf(i)]].y);
    if(down&&l[0].y<.34&&dist(l[4],l[8])<.18){for(let j=0;j<3;j++)snow.push({x:(cols/2)+(l[9].x-.5)*PW/CW+(rand()-.5)*5,y:Math.max(0,l[9].y*ROWS),s:2+rand()*3,p:rand()*6,a:.8});}
  }
  // Twist from palm orientation.
  if(hs.length===1&&hs[0].c.upright&&filmT>2.1){const l=hs[0].l,angle=Math.atan2(l[5].z-l[17].z,l[5].x-l[17].x);
    if(prevPalmAngle!==null){let d=angle-prevPalmAngle;while(d>Math.PI)d-=2*Math.PI;while(d< -Math.PI)d+=2*Math.PI;if(Math.abs(d)>Math.PI*.22&&now-prevPalmTime<450){twistDir=Math.sign(d);twistUntil=now+650;}}
    prevPalmAngle=angle;prevPalmTime=now;
  }else prevPalmAngle=null;
}
function drawCameraOverlay(res){
  // Video itself is mirrored by CSS; MediaPipe skeleton is rendered on a transparent overlay-free canvas
  // to keep the main film's character-only rendering rule intact.
  if(!res.image)return;
}
function reset(){
  playing=false;paused=false;filmT=0;stage=0;cueFlags={};startBtn.hidden=false;cam.style.display='none';
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}hands=null;auto=false;
}
function frame(now){
  const dt=Math.min(.05,(now-lastFrame)/1000||0);lastFrame=now;
  if(!playing)drawStart(now,dt);
  else if(!paused){
    if(auto){const prev=filmT;filmT=Math.min(12.25,filmT+dt);sounds(filmT,prev);}
    else sounds(filmT,lastT);
    drawFilm(now,dt);
    if(hands&&cam.readyState>=2&&!detectBusy&&now-lastDetect>55){lastDetect=now;detectBusy=true;hands.send({image:cam}).catch(()=>{}).finally(()=>detectBusy=false);}
    // When gesture-controlled, stage clock advances only within the current segment.
    if(!auto){const end=stageTimes()[Math.min(stage+1,6)];if(stage>0&&filmT<end){const prev=filmT;filmT=Math.min(end,filmT+dt);sounds(filmT,prev);} }
    lastT=filmT;
  }else drawFilm(now,0);
  requestAnimationFrame(frame);
}
startBtn.addEventListener('click',startFilm);
addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!playing)startFilm();
  if(e.code==='Space'){e.preventDefault();if(!playing)startFilm();else paused=!paused;}
  if(e.key.toLowerCase()==='r')reset();
  if(e.key.toLowerCase()==='t'){twistDir=1;twistUntil=performance.now()+650;}
  if(e.key.toLowerCase()==='d')twistDir*=-1;
  if(/^[1-6]$/.test(e.key)&&playing){const n=Number(e.key);if(n===stage+1)triggerStage(n);}
});
requestAnimationFrame(frame);
})();
